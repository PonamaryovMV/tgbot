name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  worker-tests:
    name: Backend Worker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker unit tests
        run: |
          set -o pipefail
          npm run test:worker 2>&1 | tee worker-test.log

      - name: Publish Worker test summary
        if: always()
        run: |
          if [ -f worker-test.log ]; then
            {
              echo "### Backend Worker Tests"
              echo '```text'
              cat worker-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  browser-tests:
    name: Browser Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log

      - name: Publish browser test summary
        if: always()
        run: |
          if [ -f browser-test.log ]; then
            {
              echo "### Browser Playwright Tests"
              echo '```text'
              cat browser-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
