name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  worker-tests:
    name: Backend Worker Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker unit tests
        run: |
          set -o pipefail
          npm run test:worker 2>&1 | tee worker-test.log

      - name: Report failure to Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "Коммит: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```text'
            if [ -f worker-test.log ]; then
              tail -n 120 worker-test.log
            else
              echo "Лог worker-test.log не создан (ошибка на этапе подготовки окружения)."
            fi
            echo '```'
          } > "$BODY_FILE"
          gh issue create \
            --title "CI Fail: Backend Worker Tests (${GITHUB_SHA::7})" \
            --body-file "$BODY_FILE"

      - name: Close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list --state open --search "CI Fail: Backend Worker Tests in:title" --json number -q '.[].number'); do
            gh issue close "$num" --comment "Исправлено в коммите ${{ github.sha }}"
          done

  browser-tests:
    name: Browser Playwright Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm install 2>&1 | tee -a browser-test.log

      - name: Install Playwright Chromium
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee -a browser-test.log

      - name: Run browser tests
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee -a browser-test.log

      - name: Report failure to Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "Коммит: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```text'
            if [ -f browser-test.log ]; then
              tail -n 120 browser-test.log
            else
              echo "Лог browser-test.log не создан (ошибка на этапе подготовки окружения)."
            fi
            echo '```'
          } > "$BODY_FILE"
          gh issue create \
            --title "CI Fail: Browser Playwright Tests (${GITHUB_SHA::7})" \
            --body-file "$BODY_FILE"

      - name: Close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list --state open --search "CI Fail: Browser Playwright Tests in:title" --json number -q '.[].number'); do
            gh issue close "$num" --comment "Исправлено в коммите ${{ github.sha }}"
          done
